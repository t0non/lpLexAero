<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diagnóstico Preliminar do Caso | LexAero</title>
<meta name="description" content="Ferramenta orientativa de estimativa de faixa de dano moral em casos de transporte aéreo. Não constitui promessa de resultado." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Reset & Tokens ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black: #0F172A;
  --graphite: #1E293B;
  --surface: #1E293B;
  --surface-2: #334155;
  --gold: #FCBD26;
  --gold-dark: #C99A1A;
  --gold-soft: rgba(252,189,38,0.15);
  --gold-border: rgba(252,189,38,0.35);
  --white: #F8FAFC;
  --muted: #94A3B8;
  --muted-2: #64748B;
  --border: #334155;
  --green: #3ECA7F;
  --green-soft: rgba(62,202,127,0.15);
  --amber: #FCBD26;
  --amber-soft: rgba(252,189,38,0.15);
  --red: #F26B5B;
  --red-soft: rgba(242,107,91,0.15);
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 24px;
  --ease: cubic-bezier(.22,.61,.36,1);
}

html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: 'Poppins', system-ui, sans-serif;
  background: var(--black);
  color: var(--white);
  font-size: 16px;
  line-height: 1.6;
}

h1,h2,h3 { font-weight: 600; line-height: 1.2; color: var(--white); }
p { color: var(--muted); margin: 0; }
a { color: var(--gold-dark); text-decoration: none; }

/* ── Layout ── */
.split-layout {
  display: flex;
  height: 100vh;
  width: 100vw;
}
.split-image {
  flex: 1;
  background-image: linear-gradient(to right, rgba(15,23,42,0) 50%, rgba(15,23,42,1) 100%), url('/kareline-diagnostico-apresentacao.png');
  background-size: cover;
  background-position: center bottom;
  background-repeat: no-repeat;
  display: none;
}
.split-calc {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 100%;
}
@media (min-width: 992px) {
  .split-image { display: block; }
}

.page {
  flex: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.calc-header {
  text-align: center;
  margin-bottom: 1.25rem;
}
.logo-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 1rem; }
.logo-wrap img { height: 32px; width: auto; }

.hero-title {
  font-size: clamp(1.1rem, 3.5vw, 1.4rem);
  font-weight: 700;
  margin-bottom: 0.5rem;
}
.hero-title span { color: var(--gold-dark); }

/* Notice banner */
.notice {
  display: inline-flex;
  align-items: flex-start;
  gap: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 0.75rem 1rem;
  text-align: left;
  max-width: 100%;
  margin: 0 auto;
  font-size: 0.75rem;
  color: var(--muted);
  line-height: 1.5;
}
.notice strong { color: var(--gold-dark); }
.notice-icon { flex-shrink: 0; color: var(--gold-dark); margin-top: 2px; }

/* Progress */
.progress-wrap { margin-bottom: 1.25rem; }
.progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; position: relative; }
.progress-label { font-size: 0.75rem; color: var(--muted); font-weight: 500; }
.progress-track { height: 6px; background: var(--border); border-radius: 100px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-dark)); border-radius: 100px; transition: width 0.45s var(--ease); }

/* Main card */
.calc-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0.5rem 1rem; overflow: hidden; }
.calc-grid { width: 100%; max-width: 580px; max-height: 100%; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 1rem; align-items: center; }

.calc-left {
  display: flex;
  flex-direction: column;
  max-height: 100%;
}

.form-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 1.25rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.03);
  width: 100%;
}

.step-question {
  font-size: clamp(1.05rem, 2.5vw, 1.25rem);
  font-weight: 600;
  margin-bottom: 0.25rem;
  line-height: 1.3;
  text-align: center;
}
.step-hint { font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; text-align: center; }
.step-hint.warn { color: var(--gold-dark); font-weight: 500; }

/* Option buttons */
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
  max-height: 45vh;
  overflow-y: auto;
  scrollbar-width: none;
  padding: 8px;
  margin: -8px -8px 0.5rem -8px;
}
.options-list {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
  max-height: 45vh;
  overflow-y: auto;
  scrollbar-width: none;
  padding: 8px;
  margin: -8px -8px 0.5rem -8px;
}
.options-grid::-webkit-scrollbar, .options-list::-webkit-scrollbar { display: none; }

.opt-btn {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  width: 100%;
  padding: 0.6rem 0.8rem;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  color: var(--white);
  font-family: 'Poppins', sans-serif;
  font-size: 0.95rem;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.18s, background 0.18s, transform 0.15s, box-shadow 0.18s;
  line-height: 1.35;
}
.opt-btn:hover {
  border-color: var(--gold);
  background: var(--gold-soft);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(252,189,38,0.1);
}
.opt-btn:active { transform: translateY(0); }
.opt-btn.selected {
  border-color: var(--gold);
  background: var(--gold-soft);
}
.opt-icon {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.opt-check {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  border: 1.5px solid var(--border);
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  font-size: 12px;
  color: transparent;
  background: var(--surface);
}
.opt-btn.selected .opt-check {
  background: var(--gold);
  border-color: var(--gold);
  color: #fff;
}

/* Action buttons */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  width: 100%;
  padding: 0.95rem 1.5rem;
  background: var(--gold);
  color: #fff;
  font-family: 'Poppins', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  border: none;
  border-radius: 100px;
  cursor: pointer;
  transition: background 0.18s, transform 0.15s, box-shadow 0.18s;
  box-shadow: 0 4px 14px rgba(252,189,38,0.3);
  text-decoration: none;
  margin-bottom: 0.75rem;
}
.btn-primary:hover { background: var(--gold-dark); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(252,189,38,0.4); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

.btn-back {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  background: none;
  border: none;
  color: var(--muted-2);
  font-family: 'Poppins', sans-serif;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  padding: 0.5rem 0;
  transition: color 0.15s;
}
.btn-back:hover { color: var(--gold-dark); }

/* Fields */
.field-group { margin-bottom: 1.25rem; }
.field-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--white); margin-bottom: 0.4rem; }
.field-label span { font-weight: 400; color: var(--muted-2); }
.field-input {
  width: 100%;
  padding: 0.9rem 1rem;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  color: var(--white);
  font-family: 'Poppins', sans-serif;
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.18s, box-shadow 0.18s;
}
.field-input::placeholder { color: var(--muted-2); }
.field-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }

.lgpd-label {
  display: flex;
  gap: 0.65rem;
  align-items: flex-start;
  font-size: 0.75rem;
  color: var(--muted);
  line-height: 1.55;
  margin-bottom: 1.5rem;
  cursor: pointer;
}
.lgpd-label input[type="checkbox"] {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  margin-top: 1px;
  accent-color: var(--gold);
  cursor: pointer;
}

.trust-row {
  display: flex;
  justify-content: center;
  gap: 1.5rem;
  margin-top: 0.75rem;
}
.trust-item { display: flex; align-items: center; gap: 0.35rem; font-size: 0.72rem; color: var(--muted); font-weight: 500; }

.disclaimer {
  font-size: 0.72rem;
  color: var(--muted-2);
  text-align: center;
  margin-top: 1.25rem;
  line-height: 1.5;
  padding: 0.75rem;
  background: var(--surface-2);
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
}
.disclaimer strong { color: var(--muted); }

/* ── Result sidebar ── */
.result-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  position: sticky;
  top: 1.5rem;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.03);
}

.result-empty {
  padding: 2.5rem 1.5rem;
  text-align: center;
  color: var(--muted-2);
}
.result-empty svg { margin-bottom: 0.75rem; opacity: 0.5; color: var(--muted-2); }
.result-empty p { font-size: 0.85rem; }

.result-head {
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border);
}
.result-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted-2); margin-bottom: 0.5rem; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  font-weight: 700;
  padding: 5px 10px;
  border-radius: 100px;
}
.badge-dot { width: 8px; height: 8px; border-radius: 50%; }
.badge-alta { background: var(--green-soft); color: #2E9B60; }
.badge-alta .badge-dot { background: #2E9B60; }
.badge-media { background: var(--amber-soft); color: var(--gold-dark); }
.badge-media .badge-dot { background: var(--gold-dark); }
.badge-baixa { background: var(--red-soft); color: #D94838; }
.badge-baixa .badge-dot { background: #D94838; }

.result-range {
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border);
  text-align: center;
}
.range-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted-2); margin-bottom: 0.4rem; }
.range-value { font-size: 1.7rem; font-weight: 700; color: var(--gold-dark); line-height: 1.1; margin-bottom: 0.25rem; }
.range-sub { font-size: 0.7rem; color: var(--muted-2); }

.score-wrap { margin: 1rem 0 0.25rem; }
.score-track { height: 7px; background: var(--border); border-radius: 100px; overflow: hidden; }
.score-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-dark)); border-radius: 100px; transition: width 0.6s var(--ease); }
.score-pct { font-size: 0.72rem; color: var(--muted-2); text-align: right; margin-top: 0.3rem; font-weight: 500; }

.result-factors { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); }
.factors-title { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted-2); margin-bottom: 0.75rem; }
.factor-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0.5rem 0;
  border-bottom: 1px dashed var(--border);
  font-size: 0.82rem;
}
.factor-item:last-child { border-bottom: none; }
.factor-name { color: var(--muted); }
.factor-pts { font-weight: 700; font-size: 0.78rem; }
.pts-pos { color: #2E9B60; }
.pts-neg { color: #D94838; }
.pts-gate { color: #D94838; font-weight: 700; }

.result-disc { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); font-size: 0.72rem; color: var(--muted-2); line-height: 1.5; }

.result-actions { padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 0.65rem 0.65rem 0.65rem 1.75rem;
  background: var(--gold);
  color: #111;
  font-family: 'Poppins', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  border-radius: 100px;
  border: 1.5px solid var(--gold);
  cursor: pointer;
  text-decoration: none;
  transition: all 0.18s;
}
.btn-primary:hover {
  background: var(--gold-dark);
  border-color: var(--gold-dark);
  transform: translateY(-2px);
}
.btn-icon-circle {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  color: var(--gold);
  border-radius: 50%;
  width: 38px;
  height: 38px;
  margin-left: 0.85rem;
  transition: transform 0.18s;
  flex-shrink: 0;
}
.btn-icon-circle svg { width: 20px; height: 20px; }
.btn-primary:hover .btn-icon-circle { transform: scale(1.05); }
.wa-note { font-size: 0.7rem; color: var(--muted-2); text-align: center; }

/* ── Submitted state ── */
.submitted-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 3rem 1.5rem;
}
.submitted-icon {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--green-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1.25rem;
  color: #2E9B60;
}
.submitted-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.6rem; color: var(--white); }
.submitted-text { font-size: 0.95rem; color: var(--muted); line-height: 1.65; max-width: 380px; }

/* ── Footer ── */
.calc-footer {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 1.5rem 1rem;
  text-align: center;
  font-size: 0.75rem;
  color: var(--muted);
}
.calc-footer a { color: var(--gold-dark); font-weight: 500; }
.calc-footer strong { color: var(--white); font-weight: 600; }

/* ── Responsive ── */
@media (max-width: 860px) {
  .calc-grid { grid-template-columns: 1fr; gap: 1.5rem; }
  .result-card { position: static; }
  .options-grid { grid-template-columns: 1fr; }
  .hero-title { font-size: 1.25rem; }
  .notice { font-size: 0.7rem; }
}

/* Animation */
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.fade-up { animation: fadeUp 0.3s var(--ease) both; }
@keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="split-layout">
  <div class="split-image"></div>
  <div class="split-calc">
    <div class="page">

  <!-- MAIN -->
  <div class="calc-main">
    <div class="calc-grid">

      <!-- LEFT COLUMN -->
      <div class="calc-left">
        
        <!-- HEADER -->
        <div class="calc-header">
          <div class="logo-wrap">
            <img src="/logo_lexaero_dark.png" alt="LexAero" onerror="this.src='/logo_lexaero.png'">
          </div>
          <h1 class="hero-title">Descubra quanto você pode <span>ganhar!</span></h1>
        </div>

        <!-- PROGRESS -->
        <div class="progress-wrap" id="progress-wrap">
          <div class="progress-top">
            <span class="progress-label" id="progress-label">Etapa 1 de 6</span>
            <div class="timer-badge" id="timer-badge" style="position:absolute; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:4px; font-size:0.75rem; color:#D94838; font-weight:600; background:rgba(217,72,56,0.1); padding:2px 8px; border-radius:100px;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span id="timer-display">02:00</span>
            </div>
            <span class="progress-label" id="progress-pct">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
          </div>
        </div>

        <!-- FORM CARD -->
        <div class="form-card" id="form-card">
          <!-- Steps injected by JS -->
        </div>

        <div class="notice" style="margin-top: 1.5rem; justify-content: center; background: transparent; border: none; padding: 0;">
          <span class="notice-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </span>
          <span><strong>Aviso legal:</strong> Ferramenta orientativa baseada em jurisprudência.      </div>
    </div>
  </div>
</div>    </div>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
// ── State ──
const state = {
  step: 0,
  answers: {},
  score: 0,
  factors: [],
  leadCaptured: false,
  lead: null,
};

const TOTAL_STEPS = 6;

// ── Step definitions ──
const STEPS = [
  {
    id: 'problem',
    question: 'Qual problema você enfrentou com o voo?',
    hint: 'Análise gratuita: descubra se você tem direito a indenização.',
    hintClass: '',
    type: 'grid',
    options: [
      { label: 'Voo Atrasado', icon: '<img src="/icone-voo-atrasado.png" style="width:36px; height:36px; object-fit:contain">', value: 'atraso' },
      { label: 'Voo Cancelado', icon: '<img src="/icone-voo-atrasado.png" style="width:36px; height:36px; object-fit:contain">', value: 'cancelado' },
      { label: 'Overbooking', icon: '<img src="/icone-overbooking.png" style="width:36px; height:36px; object-fit:contain">', value: 'overbooking' },
      { label: 'Conexão Perdida', icon: '<img src="/icone-perda-conexao.png" style="width:36px; height:36px; object-fit:contain">', value: 'conexao' },
      { label: 'Bagagem Extraviada', icon: '<img src="/icone-bagagem.png" style="width:36px; height:36px; object-fit:contain">', value: 'bagagem' },
      { label: 'Bagagem Danificada', icon: '<img src="/icone-bagagem.png" style="width:36px; height:36px; object-fit:contain">', value: 'bagagem-danificada' },
    ],
  },
  {
    id: 'delay',
    question: 'Quanto tempo durou o problema?',
    hint: 'Quanto mais tempo, maior a chance de indenização significativa.',
    hintClass: '',
    type: 'list',
    condition: (a) => ['atraso','cancelado','conexao'].includes(a.problem),
    options: [
      { label: 'Menos de 1 hora', value: 'lt1h' },
      { label: 'Entre 1 e 2 horas', value: '1-2h' },
      { label: 'Entre 2 e 4 horas', value: '2-4h' },
      { label: 'Mais de 4 horas', value: 'gt4h' },
      { label: 'Pernoitei fora de casa', value: 'overnight' },
      { label: 'Voo cancelado com antecedência (mais de 72h)', value: 'cancelado-antecipado' },
    ],
    altQuestion: 'O que aconteceu com sua bagagem?',
    altHint: '',
    altOptions: [
      { label: 'Não chegou no destino (extraviada)', value: 'extraviada' },
      { label: 'Demorou muito para chegar', value: 'atrasada' },
      { label: 'Chegou danificada', value: 'danificada' },
      { label: 'Parte dos itens sumiu', value: 'violada' },
    ],
  },
  {
    id: 'assistance',
    question: 'A companhia ofereceu assistência durante o problema?',
    hint: 'A falta de assistência é um agravante importante.',
    hintClass: 'warn',
    type: 'list',
    options: [
      { label: 'Sim, cumpriu tudo adequadamente', value: 'completa' },
      { label: 'Ofereceu algo, mas de forma insuficiente', value: 'parcial' },
      { label: 'Não ofereceu nada', value: 'nenhuma' },
      { label: 'Não sei informar', value: 'desconhece' },
    ],
  },
  {
    id: 'impact',
    question: 'O problema gerou algum desses impactos?',
    hint: 'Selecione tudo que se aplicar.',
    hintClass: '',

// ── Scoring engine ──
function calcScore() {
  const a = state.answers;
  let score = 30; // base
  const factors = [];

  // Problem type
  const probMap = { cancelado: 20, overbooking: 18, overnight: 15, atraso: 10, conexao: 12, bagagem: 8, 'bagagem-danificada': 8 };
  const probPts = probMap[a.problem] || 10;
  score += probPts;
  factors.push({ name: 'Tipo de problema', pts: `+${probPts}`, cls: 'pts-pos' });

  // Delay severity
  const delayMap = { overnight: 22, gt4h: 18, '2-4h': 12, cancelado: 16, '1-2h': 6, lt1h: 0, 'cancelado-antecipado': 8 };
  const delayPts = delayMap[a.delay] || 0;
  if (delayPts > 0) { score += delayPts; factors.push({ name: 'Gravidade / duração', pts: `+${delayPts}`, cls: 'pts-pos' }); }

  // No assistance (agravante)
  if (a.assistance === 'nenhuma') { score += 15; factors.push({ name: 'Sem assistência da cia.', pts: '+15', cls: 'pts-pos' }); }
  else if (a.assistance === 'parcial') { score += 8; factors.push({ name: 'Assistência insuficiente', pts: '+8', cls: 'pts-pos' }); }
  else if (a.assistance === 'completa') { score -= 5; factors.push({ name: 'Assistência prestada', pts: '-5', cls: 'pts-neg' }); }

  // Impacts (multi)
  const impactPts = { negocio: 15, evento: 18, gastos: 8, constrangimento: 10, vulneravel: 12, nenhum: -5 };
  (a.impact || []).forEach(imp => {
    const pts = impactPts[imp] || 0;
    if (pts !== 0) {
      score += pts;
      const label = { negocio:'Compromisso profissional', evento:'Evento importante perdido', gastos:'Gastos extras', constrangimento:'Situação constrangedora', vulneravel:'Grupo vulnerável', nenhum:'Sem impacto adicional' }[imp];
      factors.push({ name: label, pts: pts > 0 ? `+${pts}` : `${pts}`, cls: pts > 0 ? 'pts-pos' : 'pts-neg' });
    }
  });

  // Period (prazo prescricional)
  if (a.period === 'gt2anos') { score -= 20; factors.push({ name: '⚠️ Prazo pode estar vencendo', pts: '-20', cls: 'pts-gate' }); }
  else if (a.period === 'anos') { score -= 5; factors.push({ name: 'Já faz algum tempo', pts: '-5', cls: 'pts-neg' }); }
  else if (a.period === 'semana' || a.period === 'mes') { score += 5; factors.push({ name: 'Caso recente', pts: '+5', cls: 'pts-pos' }); }

  score = Math.max(5, Math.min(100, score));
  return { score, factors };
}

function getRange(score, a) {
  const bases = {
    cancelado: [5000, 15000], overbooking: [5000, 12000], overnight: [4000, 10000],
    atraso: [3000, 10000], conexao: [3000, 9000], bagagem: [2000, 8000], 'bagagem-danificada': [2000, 6000],
  };
  let [lo, hi] = bases[a.problem] || [3000, 8000];
  const mult = score / 60;
  lo = Math.round(lo * mult / 500) * 500;
  hi = Math.round(hi * mult / 500) * 500;
  lo = Math.max(1500, lo);
  hi = Math.max(lo + 2000, hi);
  return `R$ ${lo.toLocaleString('pt-BR')} – R$ ${hi.toLocaleString('pt-BR')}`;
}

function getBadge(score) {
  if (score >= 60) return { label: 'Alto potencial', cls: 'badge-alta' };
  if (score >= 35) return { label: 'Médio potencial', cls: 'badge-media' };
  return { label: 'Baixo potencial', cls: 'badge-baixa' };
}

// ── Rendering ──
function updateProgress() {
  const pct = Math.round((state.step / TOTAL_STEPS) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-label').textContent = state.step < TOTAL_STEPS ? `Etapa ${state.step} de ${TOTAL_STEPS}` : 'Quase lá!';
}

function getActiveStep(idx) {
  const st = STEPS[idx];
  if (!st) return null;
  // bagagem/bagagem-danificada: use altOptions on step 1
  if (idx === 1 && ['bagagem','bagagem-danificada'].includes(state.answers.problem)) {
    return { ...st, question: st.altQuestion, hint: st.altHint || '', options: st.altOptions };
  }
  return st;
}

function renderStep(idx) {
  const card = document.getElementById('form-card');
  const st = getActiveStep(idx);
  if (!st) return renderLoading();

  let optHTML = '';
  if (st.type === 'grid') {
    optHTML = `<div class="options-grid">` + st.options.map(o => `
      <button class="opt-btn" onclick="pickSingle('${st.id}','${o.value}')">
        <span class="opt-icon">${o.icon}</span>
        <span>${o.label}</span>
      </button>
    `).join('') + `</div>`;
  } else if (st.type === 'list') {
    optHTML = `<div class="options-list">` + st.options.map(o => `
      <button class="opt-btn" onclick="pickSingle('${st.id}','${o.value}')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
        ${o.label}
      </button>
    `).join('') + `</div>`;
  } else if (st.type === 'multi') {
    const selected = state.answers[st.id] || [];
    optHTML = `<div class="options-list" id="multi-list">` + st.options.map(o => `
      <button class="opt-btn${selected.includes(o.value) ? ' selected' : ''}" onclick="toggleMulti('${st.id}','${o.value}')">
        <span class="opt-check">${selected.includes(o.value) ? '✓' : ''}</span>
        ${o.label}
      </button>
    `).join('') + `</div>
    <button class="btn-primary" onclick="confirmMulti('${st.id}')">Continuar →</button>`;
  }

  const backBtn = idx > 0 ? `<button class="btn-back" onclick="goBack()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Voltar
  </button>` : '';

  card.innerHTML = `<div class="fade-up">
    <h2 class="step-question">${st.question}</h2>
    ${st.hint ? `<p class="step-hint ${st.hintClass}">${st.hint}</p>` : ''}
    ${optHTML}
    ${backBtn}
  </div>`;

  updateProgress();
}

// ── Actions ──
function pickSingle(field, value) {
  state.answers[field] = value;
  state.step++;
  // skip delay step for non-delay problems handled above
  renderStep(state.step);
}

function toggleMulti(field, value) {
  const cur = state.answers[field] || [];
  if (cur.includes(value)) {
    state.answers[field] = cur.filter(v => v !== value);
  } else {
    state.answers[field] = [...cur, value];
  }
  renderStep(state.step);
}

function confirmMulti(field) {
  if (!(state.answers[field] || []).length) {
    state.answers[field] = [];
  }
  state.step++;
  renderStep(state.step);
}

function goBack() {
  if (state.step > 0) { state.step--; renderStep(state.step); }
}

function handleSubmit(e) {
  e.preventDefault();
  const name = document.getElementById('f-name').value;
  const phone = document.getElementById('f-phone').value;
  const email = document.getElementById('f-email')?.value || '';
  
  state.lead = { name, phone, email };
  state.leadCaptured = true;
  
  renderDone(name.split(' ')[0]);
}

}, 1000);
